name: iOS build → TestFlight
on:
  workflow_dispatch:
    inputs:
      asc_issuer:     { description: "App Store Connect Issuer ID", required: true }
      asc_key_id:     { description: "ASC Key ID", required: true }
      asc_key_p8_b64: { description: "ASC .p8 key, base64", required: true }

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install xcodegen >/dev/null || brew upgrade xcodegen || true
          # App Store uploads require the iOS 26 SDK; the image default is 16.4.
          sudo xcode-select -s /Applications/Xcode_26.3.app
          echo "Xcode: $(xcodebuild -version | head -1)"

      - name: Write ASC key
        run: |
          printf '%s' "${{ inputs.asc_key_p8_b64 }}" | base64 --decode > "$RUNNER_TEMP/asc.p8"

      - name: Discover Team ID
        id: team
        env:
          ASC_P8_PATH: ${{ runner.temp }}/asc.p8
          ASC_ISSUER: ${{ inputs.asc_issuer }}
          ASC_KEY_ID: ${{ inputs.asc_key_id }}
        run: |
          TEAM=$(node ios/ci/team.js)
          echo "team=$TEAM" >> "$GITHUB_OUTPUT"
          echo "Team ID: $TEAM"

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build + upload to TestFlight
        env:
          ASC_ISSUER: ${{ inputs.asc_issuer }}
          ASC_KEY_ID: ${{ inputs.asc_key_id }}
          ASC_KEY_PEM_B64: ${{ inputs.asc_key_p8_b64 }}
          ASC_P8_PATH: ${{ runner.temp }}/asc.p8
          DEVELOPMENT_TEAM: ${{ steps.team.outputs.team }}
        run: |
          export ASC_KEY_PEM="$(printf '%s' "$ASC_KEY_PEM_B64" | base64 --decode)"
          cd ios
          fastlane beta
