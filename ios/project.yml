# XcodeGen spec — `xcodegen` turns this into ScarletTalk.xcodeproj in CI.
name: ScarletTalk
options:
  bundleIdPrefix: com.idoschoenberg
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"      # injected by CI from the ASC account
    # Manual distribution signing: automatic signing archives with a development
    # profile, which needs a registered device — impossible on a headless runner.
    # CI creates the cert + this named profile via the ASC API before building.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
    PROVISIONING_PROFILE_SPECIFIER: "ScarletTalk AppStore"
    SWIFT_VERSION: "5.9"

targets:
  ScarletTalk:
    type: application
    platform: iOS
    dependencies:
      # Embeds the watch app into the iPhone build (Embed Watch Content) so
      # one TestFlight upload carries both; the watch app still declares
      # WKRunsIndependentlyOfCompanionApp and runs standalone on cellular.
      - target: ScarletWatch
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idoschoenberg.scarlettalk
        # Repeated at TARGET level: XcodeGen's presets set the development
        # identity here, and target settings outrank the project-level block.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "ScarletTalk AppStore"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone + iPad. iPad capability is what makes the app run as a real,
        # resizable large-screen app on Apple-Silicon Macs — which flips the UI
        # into the three-pane SplitShell (sidebar · list · detail) instead of a
        # phone-sized window. One codebase; presentation switches by size class.
        TARGETED_DEVICE_FAMILY: "1,2"
    # XcodeGen GENERATES Info.plist at this path from these properties —
    # anything not listed here does not ship, so every key lives here.
    info:
      path: Sources/Info.plist
      properties:
        # XcodeGen writes literal "1" defaults otherwise — tie the shipped
        # versions to the build settings so CI's stamp actually ships.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Talk
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad supports all orientations (and, on a Mac, a freely resizable
        # window) so the three-pane layout gets real width to work with.
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # `location` joined `audio` for the live-session location stream:
        # allowsBackgroundLocationUpdates CRASHES without this mode, and the
        # CarPlay bug (2026-08-15, navigation from an hour-old position) is
        # only fixable with background delivery while driving. The stream runs
        # ONLY during live voice sessions and stops with them.
        UIBackgroundModes: [audio, location]
        # CarPlay scene (voice-based conversational category, iOS 26.4). Declares
        # ONLY the CarPlay role — leaving the window role undeclared lets SwiftUI's
        # WindowGroup keep managing the phone/iPad/Mac window. Ships DORMANT: with
        # no CarPlay entitlement granted, iOS never connects this scene, so the
        # rest of the app is unaffected. The entitlement (below, commented) is
        # added only after Apple grants it and the CI profile carries it.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"
        NSMicrophoneUsageDescription: "Scarlet listens when you talk to her."
        # Hands-free launch via the "Talk to Scarlet" App Intent. Pure AppIntents
        # need NO com.apple.developer.siri entitlement (that would require the
        # provisioning profile to carry it, breaking CI signing) — only this
        # plist string, plus an alternate app name so Siri hears "Scarlet" even
        # though the app's display name is "Talk".
        NSSiriUsageDescription: 'Scarlet uses Siri so you can start a hands-free conversation by voice — just say "Talk to Scarlet".'
        # NOTE: INAlternativeAppNames was REMOVED — it generated an empty Siri
        # name synonym that made App Store processing SILENTLY reject every
        # build from 131 on (ITMS-90626: "Name synonym '' is too short"), so
        # nothing past 130 ever appeared in TestFlight. The "Talk to Scarlet"
        # App Shortcut still works via the app name; bare-"Scarlet" Siri
        # recognition can be re-added later with a valid, non-empty synonym.
        NSCameraUsageDescription: "So you can show Scarlet a document or a scene to analyze."
        NSLocationWhenInUseUsageDescription: "So Scarlet can answer weather, distances and directions where you are."
        # "Always" lets a voice session that starts with the phone locked
        # (CarPlay, pocket) still stream your position — without it, iOS
        # refuses a background start and navigation answers go stale.
        NSLocationAlwaysAndWhenInUseUsageDescription: "So Scarlet always knows where you are during live calls and drives — even when the phone is locked in the car — and never navigates from an old position."
        NSHealthShareUsageDescription: "Scarlet reads your health and fitness data to show it and answer your questions."
        # Required by App Store validation whenever HealthKit is linked. The
        # iPhone app itself still only reads — workouts started by voice are
        # recorded and saved by the WATCH app (see the ScarletWatch target).
        NSHealthUpdateUsageDescription: "The iPhone app does not write to your health data; workouts you start by voice are recorded and saved by Scarlet on your Apple Watch."
        ITSAppUsesNonExemptEncryption: false
    # XcodeGen GENERATES the entitlements file at this path from these
    # properties, same as Info.plist above.
    entitlements:
      path: Sources/ScarletTalk.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Real-time HealthKit observer wake-ups while backgrounded — the
        # data-doctrine path (enableBackgroundDelivery .immediate).
        com.apple.developer.healthkit.background-delivery: true
        # CarPlay — voice-based conversational category (iOS 26.4). Apple
        # granted the entitlement 2026-08-04 and the capability was enabled on
        # the App ID 2026-08-11; sigh's force:true regeneration includes it in
        # the profile automatically each run. If codesign ever fails "profile
        # doesn't include the entitlement", the App ID capability got dropped —
        # re-check it in the portal before touching this line.
        com.apple.developer.carplay-voice-based-conversation: true

  # Scarlet on the wrist — same server brain, one-orb UI. Standalone on
  # cellular (leave the phone at home); the token arrives from the iPhone
  # over WatchConnectivity, or via one-time code entry.
  ScarletWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchSources
      # Shared endpoints + Keychain token store — one source of truth with
      # the phone app (Foundation + Security only, watch-safe).
      - path: Sources/AppConfig.swift
      # Same live-position reporter as the phone (CoreLocation is watch-safe):
      # wrist-only sessions feed the SAME op=location store, so "here" answers
      # track his movement instead of an hour-old phone fix.
      - path: Sources/LocationReporter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idoschoenberg.scarlettalk.watchkitapp
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=watchos*]": "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "ScarletWatch AppStore"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: WatchSources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Scarlet
        CFBundleIconName: AppIcon
        WKApplication: true
        # The whole point: works with the iPhone left at home.
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.idoschoenberg.scarlettalk
        # Keeps her voice playing when the wrist drops mid-answer.
        UIBackgroundModes: [audio]
        # Keeps a voice-started workout session (WorkoutManager) running when
        # the wrist drops — watchOS's workout background mode is WKBackground-
        # Modes, separate from the audio mode above.
        WKBackgroundModes: [workout-processing]
        NSMicrophoneUsageDescription: "Scarlet listens when you talk to her."
        NSLocationWhenInUseUsageDescription: "So Scarlet can answer weather, distances and directions from where you are right now."
        NSLocationAlwaysAndWhenInUseUsageDescription: "So Scarlet always knows where you are during live calls, even mid-walk with the watch on your wrist."
        NSHealthShareUsageDescription: "Scarlet reads heart rate and calories to narrate your workout live."
        # The watch app WRITES: a voice-started workout is recorded here and
        # saved to Health so it counts toward the rings.
        NSHealthUpdateUsageDescription: "Scarlet saves the workouts you start by voice to Health, including heart rate and calories."
        ITSAppUsesNonExemptEncryption: false
    # Watch entitlements, generated like the phone's above. HealthKit here is
    # NEW capability surface: the ScarletWatch App ID must have HealthKit
    # enabled in the portal before CI's regenerated "ScarletWatch AppStore"
    # profile can carry the entitlement — same failure signature as CarPlay
    # ("profile doesn't include the entitlement") if it's missing.
    entitlements:
      path: WatchSources/ScarletWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
