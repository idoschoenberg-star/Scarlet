# XcodeGen spec — `xcodegen` turns this into ScarletTalk.xcodeproj in CI.
name: ScarletTalk
options:
  bundleIdPrefix: com.idoschoenberg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"      # injected by CI from the ASC account
    # Manual distribution signing: automatic signing archives with a development
    # profile, which needs a registered device — impossible on a headless runner.
    # CI creates the cert + this named profile via the ASC API before building.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"
    PROVISIONING_PROFILE_SPECIFIER: "ScarletTalk AppStore"
    SWIFT_VERSION: "5.9"

targets:
  ScarletTalk:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idoschoenberg.scarlettalk
        INFOPLIST_KEY_CFBundleDisplayName: "Talk"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # Native audio powers — the whole reason for going native.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Scarlet listens when you talk to her."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "So Scarlet can answer weather, distances and directions where you are."
      properties:
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
    info:
      path: Sources/Info.plist
