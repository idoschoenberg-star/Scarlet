# XcodeGen spec — `xcodegen` turns this into ScarletTalk.xcodeproj in CI.
name: ScarletTalk
options:
  bundleIdPrefix: com.idoschoenberg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"      # injected by CI from the ASC account
    # Manual distribution signing: automatic signing archives with a development
    # profile, which needs a registered device — impossible on a headless runner.
    # CI creates the cert + this named profile via the ASC API before building.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
    PROVISIONING_PROFILE_SPECIFIER: "ScarletTalk AppStore"
    SWIFT_VERSION: "5.9"

targets:
  ScarletTalk:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idoschoenberg.scarlettalk
        # Repeated at TARGET level: XcodeGen's presets set the development
        # identity here, and target settings outrank the project-level block.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "ScarletTalk AppStore"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone + iPad. iPad capability is what makes the app run as a real,
        # resizable large-screen app on Apple-Silicon Macs — which flips the UI
        # into the three-pane SplitShell (sidebar · list · detail) instead of a
        # phone-sized window. One codebase; presentation switches by size class.
        TARGETED_DEVICE_FAMILY: "1,2"
    # XcodeGen GENERATES Info.plist at this path from these properties —
    # anything not listed here does not ship, so every key lives here.
    info:
      path: Sources/Info.plist
      properties:
        # XcodeGen writes literal "1" defaults otherwise — tie the shipped
        # versions to the build settings so CI's stamp actually ships.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Talk
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        # iPhone: portrait for the app, PLUS landscape so a full-screen photo can
        # rotate. The app stays portrait everywhere except the full-screen photo
        # viewer — an AppDelegate orientation gate (OrientationGate) narrows the
        # live mask to portrait and only opens landscape while that viewer is up.
        # (Info.plist here is the ceiling; the gate restricts within it.)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad supports all orientations (and, on a Mac, a freely resizable
        # window) so the three-pane layout gets real width to work with.
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        # CarPlay scene (voice-based conversational category, iOS 26.4). Declares
        # ONLY the CarPlay role — leaving the window role undeclared lets SwiftUI's
        # WindowGroup keep managing the phone/iPad/Mac window. Ships DORMANT: with
        # no CarPlay entitlement granted, iOS never connects this scene, so the
        # rest of the app is unaffected. The entitlement (below, commented) is
        # added only after Apple grants it and the CI profile carries it.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"
        NSMicrophoneUsageDescription: "Scarlet listens when you talk to her."
        # Hands-free launch via the "Talk to Scarlet" App Intent. Pure AppIntents
        # need NO com.apple.developer.siri entitlement (that would require the
        # provisioning profile to carry it, breaking CI signing) — only this
        # plist string, plus an alternate app name so Siri hears "Scarlet" even
        # though the app's display name is "Talk".
        NSSiriUsageDescription: 'Scarlet uses Siri so you can start a hands-free conversation by voice — just say "Talk to Scarlet".'
        # NOTE: INAlternativeAppNames was REMOVED — it generated an empty Siri
        # name synonym that made App Store processing SILENTLY reject every
        # build from 131 on (ITMS-90626: "Name synonym '' is too short"), so
        # nothing past 130 ever appeared in TestFlight. The "Talk to Scarlet"
        # App Shortcut still works via the app name; bare-"Scarlet" Siri
        # recognition can be re-added later with a valid, non-empty synonym.
        NSCameraUsageDescription: "So you can show Scarlet a document or a scene to analyze."
        # Embedded Reminders server: the app reads/writes Apple Reminders
        # directly via EventKit (no Mac bridge). Both keys carry the same
        # string — the second is the iOS 17+ full-access variant.
        NSRemindersUsageDescription: "So Scarlet can show and manage your Apple Reminders."
        NSRemindersFullAccessUsageDescription: "So Scarlet can show and manage your Apple Reminders."
        NSPhotoLibraryUsageDescription: "So Scarlet can show your recent photos and let you view them full-screen."
        NSLocationWhenInUseUsageDescription: "So Scarlet can answer weather, distances and directions where you are."
        NSHealthShareUsageDescription: "Scarlet reads your health and fitness data to show it and answer your questions."
        # Required by App Store validation whenever HealthKit is linked,
        # even though Scarlet never writes health data.
        NSHealthUpdateUsageDescription: "Scarlet does not write to your health data; this permission is declared only because Apple requires it for apps that connect to Health."
        # Tap-to-call (CallLauncher): schemes canOpenURL must be allowed to
        # probe so the thread header can show only the call buttons that will
        # actually work (tel/facetime hide on Mac; whatsapp falls back to wa.me).
        LSApplicationQueriesSchemes:
          - tel
          - whatsapp
          - facetime
          - facetime-audio
        ITSAppUsesNonExemptEncryption: false
    # XcodeGen GENERATES the entitlements file at this path from these
    # properties, same as Info.plist above.
    entitlements:
      path: Sources/ScarletTalk.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Real-time HealthKit observer wake-ups while backgrounded — the
        # data-doctrine path (enableBackgroundDelivery .immediate).
        com.apple.developer.healthkit.background-delivery: true
        # CarPlay — voice-based conversational category (iOS 26.4). Kept OUT of
        # the build until Apple grants it (request at developer.apple.com/contact/
        # carplay/) AND the CI "ScarletTalk AppStore" profile is regenerated to
        # carry it — otherwise codesign fails "profile doesn't include the
        # entitlement". Same discipline as the deliberately-absent Siri
        # entitlement above. Uncomment only after the grant + profile refresh:
        # com.apple.developer.carplay-voice-based-conversation: true
