<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="application-name" content="Scarlet Talk">
<link rel="apple-touch-icon" href="talk-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="talk-icon-192.png">
<link rel="manifest" href="manifest-talk.webmanifest">
<style>html,body{background:#0b0507;height:100%;margin:0}</style>
<script>location.replace("index.html#talk");</script>
</head>
